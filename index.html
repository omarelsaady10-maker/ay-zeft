<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhombus Store</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            background-color: #f9f9f9;
        }

        /* Header */
        .header {
            background-color: #0080ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
        }

        .logo {
            width: 90px;
        }

        .header-link {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-link a {
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 15px;
            transition: background-color 0.2s ease;
        }

        .header-link a:hover {
            background-color: #3b9eff;
        }

        /* Custom Button Style */
        .btn {
            background-color: #ec505a;
            color: white !important;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: #EE626B;
        }

        /* Hero / Main Body */
        .main-body {
            background-color: #0080ff;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 8% 60px 8%;
            border-radius: 0px 0px 40px 40px;
            gap: 30px;
        }

        .main-body .hero-content {
            max-width: 500px;
        }

        .main-body h2 {
            margin: 0;
            font-size: 24px;
        }

        .main-body h1 {
            font-size: 38px;
            margin: 10px 0;
        }

        .main-body img {
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            height: auto;
        }

        /* Search input wrapper */
        .search-wrapper {
            display: flex;
            align-items: center;
            margin-top: 25px;
            width: 100%;
            max-width: 400px;
        }

        .search-wrapper input {
            border-radius: 50px 0 0 50px;
            border: none;
            outline: none;
            padding: 12px 20px;
            font-size: 14px;
            width: 100%;
        }

        .search-wrapper .btn-search {
            border-radius: 0 50px 50px 0;
            padding: 10px 20px;
            white-space: nowrap;
        }

        /* Trending Section */
        .trending-container {
            padding: 50px 8%;
        }

        .trending-container > span {
            color: #ee626b;
            text-transform: uppercase;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .trending-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            margin-top: 5px;
        }

        .trending-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .trending-cards {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 300px;
            background-color: #FFFFFF;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card .thumb {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .card-info h3 {
            margin: 5px 0 0 0;
            font-size: 18px;
        }

        .card-info p {
            margin: 0;
            color: #888;
            font-size: 13px;
        }

        .card-info img {
            width: 35px;
        }

        /* Responsive Design for Mobile & Tablets */
        @media (max-width: 768px) {
            .header {
                padding: 15px 4%;
            }

            .header-link a {
                padding: 6px 10px;
                font-size: 13px;
            }

            .main-body {
                flex-direction: column-reverse;
                text-align: center;
                padding: 30px 5% 50px 5%;
            }

            .main-body img {
                max-width: 250px;
            }

            .search-wrapper {
                margin: 20px auto 0 auto;
            }

            .trending-container {
                padding: 40px 5%;
            }

            .trending-header h1 {
                font-size: 22px;
            }

            .trending-cards {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <img class="logo" src="https://files.catbox.moe/epyojn.png" alt="Rhombus Store Logo">
        <nav class="header-link">
            <a href="#">Home</a>
            <a href="https://files.catbox.moe/v1w0kz.png">Info</a>
            <a href="https://files.catbox.moe/qvwv8j.png">Contact</a>
            <a href="#" class="btn">Sign in</a>
        </nav>
    </header>

    <!-- Main Hero Body -->
    <section class="main-body">
        <div class="hero-content">
            <h2>Welcome to Rhombus Store</h2>
            <h1>Best Store Ever</h1>
            <p>This store is fully made with HTML5 CSS</p>
            <div class="search-wrapper">
                <input type="text" placeholder="Search for anything" />
                <a href="https://files.catbox.moe/v1w0kz.png" class="btn btn-search">Search</a>
            </div>
        </div>
        <div>
            <img src="https://files.catbox.moe/qy83zr.jpg" alt="Featured Image">
        </div>
    </section>

    <!-- Trending Games Section -->
    <section class="trending-container">
        <span>Trending</span>
        <div class="trending-header">
            <h1>Trending Games</h1>
            <a href="https://files.catbox.moe/v1w0kz.png" class="btn">View All</a>
        </div>
        <div class="trending-cards">
            <!-- Card 1 -->
            <div class="card">
                <img class="thumb" src="https://files.catbox.moe/gn2l89.jpg" alt="Assassin's Creed" />
                <div class="card-info">
                    <div class="card-name">
                        <p>Action</p>
                        <h3>Assassins Creed</h3>
                    </div>
                    <a href="https://files.catbox.moe/v1w0kz.png"><img src="https://files.catbox.moe/dlzm0t.png" alt="Icon" /></a>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <img class="thumb" src="https://files.catbox.moe/223qsm.jpg" alt="Talbes Banat" />
                <div class="card-info">
                    <div class="card-name">
                        <p>Adventure</p>
                        <h3>Talbes Banat</h3>
                    </div>
                    <a href="https://files.catbox.moe/v1w0kz.png"><img src="https://files.catbox.moe/dlzm0t.png" alt="Icon" /></a>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <img class="thumb" src="https://files.catbox.moe/hh71t8.jpg" alt="Kill Them All" />
                <div class="card-info">
                    <div class="card-name">
                        <p>Action</p>
                        <h3>Kill Them All</h3>
                    </div>
                    <a href="https://files.catbox.moe/v1w0kz.png"><img src="https://files.catbox.moe/dlzm0t.png" alt="Icon" /></a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
