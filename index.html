<!DOCTYPE html>

<Head>
    <style>
               body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            font-optical-sizing: none;
            font-weight: 500;
            font-style: normal;
        }

        .header {
            background-color: #0080ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 120px;
        }

        .logo {
            width: 100px;
        }

        .header-link a,
        button {
            color: white;
            padding: 7px 22px;
            text-decoration: none;
            border-radius: 50px;
        }

        .header-link a:hover {
            background-color: #3b9eff;
        }

        .btn {
            background-color: #ec505a;
            color: white;
            padding: 12px 19px;
            border: none;
            border-radius: 50px;
        }

        .btn:hover {
            background-color: #EE626B;
        }

        .main-body {
            background-color: #0080ff;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 180px 60px 180px;
            border-radius: 0px 0px 50px 50px;
        }

        .main-body img {
            border-radius: 20px;
            width: 350px;
        }

        .main-body h2 {
            margin: 0;
        }

        .ggss input {
            border-radius: 50px;
            border: none;
            outline: none;
            padding: 12px 50px 12px 15px;
        }

        .ggss button {
            position: absolute;
            left: 385px;
            ;
        }

        .trending {
            padding: 60px 180px 60px 180px;
        }

        .games {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .games h1 {
            margin-top: 0;
        }

        .trending-container {
            padding: 25px 50px;
        }

        .trending-container span {
            color: #ee626b;
            text-transform: uppercase;
            font-size: 14px;
        }

        .trending-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trending-header h1 {
            margin-top: 0;
        }

        .trending-cards {
            display: flex;
            gap: 30px;
        }

        .card {
            width: 300px;
            background-color: #EEEEEE;
            border-radius: 20px;
        }

        .card .thumb {
            border-radius: 20px 20px 0 0;
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 25px;
        }

        .card-info img {
            width: 50px;
        } 
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500&display=swap" rel="stylesheet">
    <title>Rhombus Store</title>
    <link rel="stylesheet" href="Header Style.css">
</Head>
